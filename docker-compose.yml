# Aryx local stack — dev only. RDB is the source of truth; FalkorDB is the
# rebuildable graph projection. Production orchestrator (ECS/EKS/OCI) is
# decided at rollout — these containers are 12-factor and portable.
services:
  postgres:
    image: pgvector/pgvector:pg16
    # Default Docker shm (64MB) is too small once parallel workers kick in on
    # multi-row aggregation queries (e.g. source_entity_type_counts) — they
    # each grab a shared memory segment and 64MB fills up under concurrent
    # requests, failing with psycopg.errors.DiskFull on /dev/shm.
    shm_size: '256mb'
    environment:
      POSTGRES_USER: aryx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aryx
    restart: unless-stopped
    # Host port 15432 (LOCAL-ONLY — do not push/commit): 55432 falls in a
    # Windows dynamic excluded-port range on this machine, blocking Docker's
    # host-port bind. In-network clients still reach this as postgres:5432.
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aryx"]
      interval: 10s
      timeout: 5s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    # MAX_QUEUED_QUERIES 25 -> 250 (commit 3167f1d) was a stopgap for queue
    # exhaustion under concurrent /ask traffic, not the fix — the root cause
    # was no shared connection pool (Container built a fresh FalkorDB client
    # per call) plus an N+1 query pattern in the /ask retrieval path. Both are
    # now fixed (aryx.graph.client_pool.get_client; retrieve.py's all_types()
    # caching) — reassess whether 250 is still needed once that lands in prod.
    environment:
      FALKORDB_ARGS: MAX_QUEUED_QUERIES 250 TIMEOUT 5000 RESULTSET_SIZE 10000
    ports:
      - "6379:6379"
    volumes:
      # FalkorDB's own entrypoint runs redis-server --dir "$FALKORDB_DATA_PATH",
      # which defaults to /var/lib/falkordb/data — NOT /data. Mounting at /data
      # (the old value here) persisted nothing; every container recreate lost
      # the graph because RDB saves landed in the ephemeral container layer.
      - graphdata:/var/lib/falkordb/data

  worker:
    build: .
    env_file: .env
    # Same issue as api/shay-api/mcp below: .env's ARYX_RDB_DSN/ARYX_GRAPH_URL
    # are the host-oriented localhost DSNs (for the host-run uvicorn dev
    # workflow) — env_file: .env above would otherwise leak them straight
    # into this container, where "localhost" means the container itself,
    # not the host, causing "connection refused" on every startup migration.
    environment:
      - ARYX_RDB_DSN=postgresql://aryx:${POSTGRES_PASSWORD}@postgres:5432/aryx
      - ARYX_GRAPH_URL=redis://falkordb:6379
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_started

  # Local LLM runtime — CPU inference for sub-2B models.
  # Models persist in the ollama_models volume so they download only once.
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=4
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # One-shot: pull the menial + reason models, then exit. Re-running is a no-op
  # once the models are cached in the volume.
  ollama-init:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull llama3.2:3b && ollama pull nomic-embed-text"]
    restart: "no"

  api:
    build: .
    env_file: .env
    command: ["uvicorn", "aryx.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Ollama service URL uses the docker-network hostname — must be set here.
    # All other ARYX_* vars are read from env_file: .env (pydantic-settings).
    environment:
      # Same issue as shay-api: .env's ARYX_RDB_DSN/ARYX_GRAPH_URL are the
      # host-oriented localhost DSNs (for the host-run uvicorn dev workflow)
      # — env_file: .env above would otherwise leak them straight into this
      # container, where "localhost" means the container itself, not the
      # host, causing "connection refused" on every startup migration.
      - ARYX_RDB_DSN=postgresql://aryx:${POSTGRES_PASSWORD}@postgres:5432/aryx
      - ARYX_GRAPH_URL=redis://falkordb:6379
      - ARYX_LLM_BASE_URL=${ARYX_LLM_BASE_URL:-http://ollama:11434}
      - ARYX_LLM_PROVIDER=${ARYX_LLM_PROVIDER:-ollama}
      - ARYX_LLM_MENIAL_MODEL=${ARYX_LLM_MENIAL_MODEL:-llama3.2:3b}
      - ARYX_LLM_REASON_MODEL=${ARYX_LLM_REASON_MODEL:-llama3.2:3b}
      - ARYX_LLM_TIMEOUT=${ARYX_LLM_TIMEOUT:-900}
      - ARYX_PER_DOC_TIMEOUT=${ARYX_PER_DOC_TIMEOUT:-600}
      - ARYX_DOC_WORKERS=${ARYX_DOC_WORKERS:-1}
      - ARYX_LLM_API_KEY=${ARYX_LLM_API_KEY:-}
      - ARYX_EMBED_MODEL=${ARYX_EMBED_MODEL:-nomic-embed-text}
      - ARYX_EMBED_ENDPOINT=${ARYX_EMBED_ENDPOINT:-http://ollama:11434}
      - ARYX_MAX_RELATE_PAIRS=${ARYX_MAX_RELATE_PAIRS:-3}
      - ARYX_RELATE_WORKERS=${ARYX_RELATE_WORKERS:-2}
      - ARYX_XML_MAX_ENTITY_TYPES=${ARYX_XML_MAX_ENTITY_TYPES:-20}
      - ARYX_XML_MAX_ROWS_PER_TYPE=${ARYX_XML_MAX_ROWS_PER_TYPE:-500}
      - ARYX_INGEST_WORKERS=${ARYX_INGEST_WORKERS:-3}
      - ARYX_ONTOLOGY_ENABLED=${ARYX_ONTOLOGY_ENABLED:-true}
      - ARYX_ONTOLOGY_FORMATS=${ARYX_ONTOLOGY_FORMATS:-turtle,json-ld,xml,n-triples}
      - ARYX_DISCOVERY_MAX_PAYLOAD_MB=${ARYX_DISCOVERY_MAX_PAYLOAD_MB:-512}
      - ARYX_INTERNAL_API_KEY=${ARYX_INTERNAL_API_KEY}
      # docs/CPQ_LAYOUT_TXT_VISIBILITY_ORDER_PLAN.md — per-catalog native-UI
      # layout exports. Dockerfile COPYs a baked-in default (so the image
      # alone is enough in a real deployment with no host to bind-mount
      # from); the bind mount below overrides it for local dev so editing
      # a file in ./config_layouts is picked up on next request — no
      # rebuild needed, only a container restart (see load_layout_display_
      # order's process-lifetime cache — this doesn't hot-reload mid-run).
      - ARYX_CPQ_LAYOUT_DIR=/app/config_layouts
    volumes:
      - ./config_layouts:/app/config_layouts:ro
    ports:
      - "127.0.0.1:8088:8000"
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  shay-api:
    build:
      context: ./shay_backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Shay must use the same relational database URL as Aryx so both apps
      # operate on the same Postgres instance and credentials.
      # NOT ${ARYX_RDB_DSN:-...}: .env's ARYX_RDB_DSN is the host-oriented
      # localhost:55432 DSN (for the host-run uvicorn dev workflow) — Compose
      # reads .env for variable substitution too, so that fallback silently
      # wins over the docker-internal default below, and every real DB call
      # from inside this container (e.g. POST /company-signup) fails with
      # "Connect call failed ('127.0.0.1', 55432)" despite the healthcheck
      # passing. Always use the docker-network hostname here.
      - DATABASE_URL=postgresql+asyncpg://aryx:${POSTGRES_PASSWORD}@postgres:5432/aryx
      # shay_backend's own config.py defaults this to "http://localhost:8088"
      # when unset — inside this container that means itself, not the real
      # Aryx api container, so every internal call (e.g. workspace lookups
      # backing /workspaces/{id}) fails with "All connection attempts failed".
      # Only the `web` service had this set before; shay-api needs it too.
      - ARYX_API_URL_INTERNAL=http://api:8000
      - SHAY_RUN_MIGRATIONS=false
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SHAY_BE_PUBLIC_URL=${SHAY_BE_PUBLIC_URL:-http://localhost:3000/shay}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/shay/api/v1/sso/google/callback}
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI:-http://localhost:3000/shay/api/v1/sso/microsoft/callback}
      - GOOGLE_GMAIL_REDIRECT_URI=${GOOGLE_GMAIL_REDIRECT_URI:-http://localhost:3000/shay/api/v1/gmail/connect/callback}
      - SF_CONNECT_REDIRECT_URI=${SF_CONNECT_REDIRECT_URI:-http://localhost:3000/shay/api/v1/sf/connect/callback}
      - ZOHO_CRM_CONNECT_REDIRECT_URI=${ZOHO_CRM_CONNECT_REDIRECT_URI:-http://localhost:3000/shay/api/v1/zoho/connect/callback}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:8090:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  mcp:
    build: .
    env_file: .env
    command: ["uvicorn", "aryx.mcp.sse:app", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      # Same docker-network override as the api service above.
      - ARYX_RDB_DSN=postgresql://aryx:${POSTGRES_PASSWORD}@postgres:5432/aryx
      - ARYX_GRAPH_URL=redis://falkordb:6379
      - ARYX_API_URL=http://api:8000
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      falkordb:
        condition: service_started
    restart: unless-stopped

  ui:
    build: .
    env_file: .env
    command: ["streamlit", "run", "src/aryx/ui/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    environment:
      - ARYX_API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Next.js web UI — isolated deploy unit. Talks to FastAPI only via HTTP.
  # No shared code with Python; replaceable without touching the backend.
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      # Aryx API is proxied by Next.js route handlers / rewrites for local and container use.
      - ARYX_API_URL_INTERNAL=${ARYX_API_URL_INTERNAL:-http://api:8000}
      - ARYX_INTERNAL_API_KEY=${ARYX_INTERNAL_API_KEY}
      # Shay is publicly exposed by nginx in OCI dev, but these internal handlers still need
      # direct container access for workspace bridge routes under apps/web/app/api/shay/*.
      - SHAY_API_URL_INTERNAL=${SHAY_API_URL_INTERNAL:-http://shay-api:8000}
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      shay-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  graphdata:
  ollama_models:
