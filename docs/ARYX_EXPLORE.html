<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aryx SOP Explorer — Flows · Agents · Logs · Files</title>
<style>
  :root {
    --bg: #0a0e14; --panel: #121820; --panel2: #1a2330; --border: #2a3648;
    --text: #e8eef7; --muted: #8fa3bb; --accent: #5b9dff; --accent2: #3dd6c6;
    --warn: #f0b429; --ok: #3ecf8e; --danger: #ff6b7a; --cpq: #c084fc;
    --ask: #60a5fa; --graph: #34d399; --sso: #f472b6; --ingest: #fbbf24;
    --mcp: #fb923c; --agent: #a78bfa; --log: #22d3ee;
    --font: Inter, system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); }
  body {
    display: grid; grid-template-rows: auto 1fr;
    background:
      radial-gradient(900px 500px at 5% -10%, #1a2740 0%, transparent 50%),
      radial-gradient(700px 400px at 100% 0%, #0f2a24 0%, transparent 45%), var(--bg);
  }
  header.app {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: .7rem 1.2rem; border-bottom: 1px solid var(--border);
    background: rgba(12,16,22,.94); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 30;
  }
  .brand { font-weight: 700; } .brand span { color: var(--accent2); }
  .hint { color: var(--muted); font-size: .8rem; flex: 1; min-width: 160px; }
  #search {
    width: min(300px, 42vw); padding: .45rem .7rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit;
  }
  .layout { display: grid; grid-template-columns: 270px 1fr; min-height: 0; }
  @media (max-width: 920px) { .layout { grid-template-columns: 1fr; } aside.rail { display: none; } }
  aside.rail {
    border-right: 1px solid var(--border); overflow-y: auto; padding: 1rem .8rem 2rem;
    background: rgba(10,14,20,.65);
  }
  aside.rail .group {
    font-size: .66rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: .85rem 0 .3rem; padding: 0 .4rem;
  }
  aside.rail a {
    display: block; padding: .32rem .5rem; border-radius: 7px; color: var(--muted);
    font-size: .84rem; text-decoration: none; margin: 1px 0; cursor: pointer;
  }
  aside.rail a:hover, aside.rail a.active { background: var(--panel2); color: var(--text); }
  main.stage { overflow-y: auto; padding: 1.15rem 1.4rem 3rem; max-width: 1180px; }
  .crumbs {
    display: flex; flex-wrap: wrap; gap: .35rem; align-items: center;
    margin-bottom: .85rem; font-size: .84rem; color: var(--muted);
  }
  .crumbs button { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  .crumbs button:hover { text-decoration: underline; }
  .crumbs .sep { opacity: .45; } .crumbs .here { color: var(--text); font-weight: 600; }
  .btn {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: .38rem .7rem; font: inherit; cursor: pointer; font-size: .84rem;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: #1a3355; border-color: #2a5080; color: #cfe0ff; }
  .hero {
    border: 1px solid var(--border); border-radius: 16px;
    background: linear-gradient(145deg, #152033, #101820 70%);
    padding: 1.25rem 1.4rem; margin-bottom: 1.1rem;
  }
  .hero h1 { margin: 0 0 .4rem; font-size: 1.5rem; }
  .hero .lead { margin: 0; color: var(--muted); max-width: 78ch; line-height: 1.55; }
  .meta { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .85rem; }
  .chip {
    font-size: .72rem; padding: .18rem .48rem; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  }
  .chip.k-system { color: var(--accent); border-color: #1f4a6e; }
  .chip.k-component { color: var(--ok); border-color: #1f5a40; }
  .chip.k-module { color: var(--cpq); border-color: #4a3a6e; }
  .chip.k-file { color: var(--warn); border-color: #5a4a1f; }
  .chip.k-agent { color: var(--agent); border-color: #4c3a7a; }
  .chip.k-log { color: var(--log); border-color: #0e4a55; }
  .chip.k-sop { color: #f9a8d4; border-color: #5a2a4a; }
  h2.sec {
    font-size: .98rem; margin: 1.45rem 0 .55rem; color: #c8d7ea;
    border-bottom: 1px solid var(--border); padding-bottom: .32rem;
  }
  p.body { color: #d0dae8; line-height: 1.55; max-width: 80ch; }
  ul.bul { color: #d0dae8; line-height: 1.55; padding-left: 1.2rem; }
  ul.bul li { margin: .28rem 0; }
  code, .mono { font-family: var(--mono); font-size: .86em; }
  pre.block {
    background: #0e141c; border: 1px solid var(--border); border-radius: 10px;
    padding: .85rem 1rem; overflow-x: auto; font-family: var(--mono); font-size: .78rem;
    color: #cfe0f5; line-height: 1.45;
  }

  /* Visual process flow */
  .flow-board {
    display: flex; flex-wrap: wrap; gap: .45rem; align-items: stretch;
    margin: .6rem 0 1rem; padding: .85rem; background: #0e141c;
    border: 1px solid var(--border); border-radius: 12px;
  }
  .flow-step {
    flex: 1 1 120px; min-width: 110px; max-width: 180px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: .55rem .6rem; position: relative;
  }
  .flow-step .n {
    font-size: .68rem; font-weight: 700; color: var(--accent2);
    margin-bottom: .2rem; font-family: var(--mono);
  }
  .flow-step .l { font-size: .82rem; font-weight: 650; margin-bottom: .2rem; }
  .flow-step .d { font-size: .72rem; color: var(--muted); line-height: 1.35; }
  .flow-arrow {
    display: flex; align-items: center; color: var(--accent2); font-size: 1.1rem;
    flex: 0 0 auto; padding: 0 .1rem; opacity: .75;
  }
  @media (max-width: 700px) {
    .flow-arrow { width: 100%; justify-content: center; transform: rotate(90deg); height: 1rem; }
    .flow-step { max-width: none; }
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .7rem; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: .85rem .95rem; cursor: pointer; text-align: left; width: 100%;
    color: inherit; font: inherit; transition: border-color .15s, transform .1s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card .t { font-weight: 650; margin-bottom: .25rem; }
  .card .b { color: var(--muted); font-size: .8rem; line-height: 1.4; }
  .card .tag {
    display: inline-block; margin-top: .45rem; font-size: .68rem;
    padding: .1rem .35rem; border-radius: 4px; background: #1c2a3d; color: #9ec0ef;
  }
  .card.tone-agent .tag { background: #2a1f45; color: #c4b5fd; }
  .card.tone-log .tag { background: #0c3a42; color: #67e8f9; }
  .card.tone-cpq .tag { background: #2a1f3d; color: #d8b4fe; }
  .card.tone-graph .tag { background: #143028; color: #6ee7b7; }
  .card.tone-sso .tag { background: #3b1f2e; color: #f9a8d4; }
  .card.tone-ingest .tag { background: #3b3010; color: #fcd34d; }
  .card.tone-mcp .tag { background: #3b2810; color: #fdba74; }
  .card.tone-ask .tag { background: #1e2a4a; color: #93c5fd; }

  .plugs { display: flex; flex-wrap: wrap; gap: .45rem; margin: .4rem 0 1rem; }
  .plug {
    display: inline-flex; align-items: center; gap: .3rem; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 999px; padding: .32rem .65rem;
    font-size: .8rem; color: var(--accent); cursor: pointer; font: inherit;
  }
  .plug:hover { border-color: var(--accent); }

  .sop-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin: .5rem 0 1rem;
  }
  @media (max-width: 800px) { .sop-grid { grid-template-columns: 1fr; } }
  .sop-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: .75rem .9rem;
  }
  .sop-box h4 { margin: 0 0 .4rem; font-size: .88rem; color: #c8d7ea; }
  .sop-box ul { margin: 0; padding-left: 1.1rem; color: var(--muted); font-size: .84rem; }
  .sop-box li { margin: .2rem 0; }

  table.t {
    width: 100%; border-collapse: collapse; font-size: .84rem;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    margin: .4rem 0 1rem;
  }
  table.t th, table.t td {
    text-align: left; padding: .5rem .65rem; border-bottom: 1px solid var(--border); vertical-align: top;
  }
  table.t th { background: var(--panel2); color: #c8d7ea; font-weight: 600; }
  table.t tr:last-child td { border-bottom: 0; }
  button.link {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font: inherit; font-family: var(--mono); font-size: .8rem; padding: 0; text-align: left;
  }
  button.link:hover { text-decoration: underline; }
  button.link.agent-chip {
    display: inline-block; font-family: var(--font) !important; font-size: .78rem;
    background: #1e2a45; border: 1px solid #2a4a70; color: #9ec5ff;
    border-radius: 999px; padding: .12rem .45rem; margin: .12rem .18rem .12rem 0;
  }
  button.link.agent-chip:hover { border-color: var(--accent); background: #243456; text-decoration: none; }
  .file-ref {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .4rem;
    margin: .15rem 0; line-height: 1.35;
  }
  a.gh-open {
    font-size: .72rem; color: var(--accent2); text-decoration: none;
    border: 1px solid #1f4a42; border-radius: 999px; padding: .05rem .4rem;
    white-space: nowrap;
  }
  a.gh-open:hover { background: rgba(61,214,198,.12); text-decoration: none; }
  td.agent-list { line-height: 1.7; }
  .callout {
    border-left: 3px solid var(--accent); background: rgba(91,157,255,.08);
    padding: .7rem .95rem; border-radius: 0 10px 10px 0; margin: .85rem 0;
    color: #c5d5e8; font-size: .88rem; line-height: 1.5;
  }
  .callout.warn { border-color: var(--warn); background: rgba(240,180,41,.08); }
  .callout.danger { border-color: var(--danger); background: rgba(255,107,122,.08); }
  .callout.ok { border-color: var(--ok); background: rgba(62,207,142,.08); }
  .log-row-p1 { color: var(--danger); font-weight: 600; }
  .log-row-p2 { color: #fb923c; font-weight: 600; }
  .log-row-p3 { color: var(--warn); }
  .log-row-p4 { color: var(--muted); }
  .search-hits {
    position: absolute; right: 1.2rem; top: 3.1rem; width: min(340px, 92vw);
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    max-height: 55vh; overflow-y: auto; z-index: 40; display: none;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .search-hits.open { display: block; }
  .search-hits button {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: var(--text); padding: .5rem .75rem; font: inherit; cursor: pointer;
    border-bottom: 1px solid var(--border); font-size: .84rem;
  }
  .search-hits button:hover { background: var(--panel2); }
  .search-hits .m { color: var(--muted); font-size: .74rem; }
  #panel.is-swapping { opacity: .35; transition: opacity 100ms ease; }
  details.more {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: .55rem .85rem; margin: .45rem 0;
  }
  details.more summary { cursor: pointer; font-weight: 600; color: #dce8f7; }
  details.more[open] summary { margin-bottom: .45rem; }
</style>
</head>
<body>
<header class="app">
  <div class="brand">Aryx <span>SOP Explorer</span></div>
  <div class="hint">SOP mind map · agents deep-dive → <a href="ARYX_AGENTS_SOP.html" style="color:var(--agent)">ARYX_AGENTS_SOP.html</a> · logs · file briefs</div>
  <input id="search" type="search" placeholder="Search agents, logs, files…" autocomplete="off" />
</header>
<div class="search-hits" id="searchHits"></div>
<div class="layout">
  <aside class="rail" id="rail"></aside>
  <main class="stage">
    <div style="margin-bottom:.65rem"><button type="button" class="btn" id="btnBack" hidden>← Back</button></div>
    <nav class="crumbs" id="crumbs"></nav>
    <div id="panel"></div>
  </main>
</div>

<script>
/** SOP-grade knowledge graph. Offline single file. */
const N = {};
function add(n) { N[n.id] = n; return n; }

function F(path, o) {
  return { path, ...o };
}

/* ═══════════════════════════════════════════════════════════════════════════
   ROOT — end-to-end application flow
   ═══════════════════════════════════════════════════════════════════════════ */
add({
  id: "root",
  title: "Aryx — End-to-End Application",
  kind: "system",
  blurb: "Identity → data plane → graph → intelligence (Ask/CPQ) → agents/MCP → ops & logs.",
  summary: "Aryx is a knowledge-graph platform. Humans and agents (MCP) authenticate, land in a workspace, ingest sources into Postgres, resolve golden entities, project FalkorDB, then ask questions or run CPQ guided quotes. This explorer is the SOP map: every component links to tasks, flows, files, and critical logs.",
  sop: {
    purpose: "Give operators and engineers a single drill-down map of the full product — not a marketing overview.",
    actors: ["Company admin", "Data steward", "Sales/SE (CPQ)", "Support analyst", "External MCP agent", "SRE/on-call"],
    preconditions: ["Postgres + FalkorDB up", "Aryx API :8088", "Shay auth available", "Web :3000 (optional)"],
    postconditions: ["Workspace has graph and/or CPQ catalog", "Questions answerable via Ask", "Logs correlatable by run_id / workspace_id"],
    failure_modes: ["Auth CSRF host mismatch", "Pipeline stuck at map HITL", "CPQ orphan questions", "Silent intent drops (blocked by regression)"],
  },
  flowSteps: [
    { n: "1", l: "Authenticate", d: "SSO / register → JWT" },
    { n: "2", l: "Tenant", d: "Company + workspace" },
    { n: "3", l: "Brief", d: "Domain intent" },
    { n: "4", l: "Ingest", d: "7-stage pipeline" },
    { n: "5", l: "Resolve", d: "ER → golden" },
    { n: "6", l: "Project", d: "FalkorDB graph" },
    { n: "7", l: "Ask / CPQ", d: "NL + guided quote" },
    { n: "8", l: "Agents", d: "MCP tools / act" },
    { n: "9", l: "Observe", d: "Logs + dashboard" },
  ],
  tasks: [
    "Onboard company and invite users (Shay)",
    "Create workspace and set survivorship",
    "Write Brief; run Start wizard or MCP onboard",
    "Ingest DB/docs/CPQ XML; approve ontology map",
    "Review adjudication queue for mid-band pairs",
    "Ask graph questions or run CPQ quote → BOM",
    "Correlate issues via run_id / Observability UI",
  ],
  children: ["identity", "data_plane", "intelligence", "agents", "logging", "surfaces", "platform"],
  plugs: [],
  logs: {
    where: [
      "Container/process stdout (12-factor) — primary application log stream",
      "UI Observability page — jobs, LLM tokens/latency, graph counts",
      "CPQ lines tagged [run_id=…] for one quote lifecycle",
      "raven_log structured records (service=aryx-api) when instrumented",
    ],
    critical: [
      { p: "P1", pattern: "cpq_bom_gate / bom_gate blocked", meaning: "BOM would have been invalid", action: "Do not ship payload; re-check constraints + provenance", files: ["src/aryx/cpq/bom_gate.py", "src/aryx/api/ask_api.py", "src/aryx/cpq/engine.py"] },
      { p: "P2", pattern: "cpq_intent_dropped", meaning: "Named change target was not handled/queued", action: "Regression exit 3; fix enqueue paths", files: ["src/aryx/cpq/intent_queue.py", "src/aryx/api/ask_api.py"] },
      { p: "P2", pattern: "cpq_orphan_question", meaning: "UI asked a question with no pending state", action: "Check pending_* fields; clarify memory", files: ["src/aryx/cpq/session_guard.py", "src/aryx/api/ask_api.py"] },
      { p: "P3", pattern: "cpq_router_shadow agreement=False", meaning: "LLM route ≠ deterministic", action: "Monitor; consider llm_first cutover", files: ["src/aryx/api/ask_api.py", "src/aryx/cpq/intent_gateway.py"] },
    ],
  },
});

/* ═══════════════════════════════════════════════════════════════════════════
   PILLARS
   ═══════════════════════════════════════════════════════════════════════════ */
add({
  id: "identity", title: "1. Identity & Tenancy", kind: "component", tone: "sso",
  blurb: "SSO, company, roles, workspaces.",
  summary: "Shay owns human identity. Domain-based companies, invites, JWT. Aryx API keys cover services/MCP (fail-closed).",
  flowSteps: [
    { n: "A", l: "Initiate SSO", d: "POST /sso/initiate + cookie" },
    { n: "B", l: "IdP", d: "Google / Microsoft" },
    { n: "C", l: "Callback", d: "state + CSRF check" },
    { n: "D", l: "JWT", d: "access + refresh" },
    { n: "E", l: "Workspace", d: "GG workspace → Aryx isolation" },
  ],
  tasks: ["Login/SSO", "Company signup", "Invite users", "Select workspace"],
  children: ["sso", "onboarding", "workspace"],
  plugs: ["web_ui", "aryx_api"],
  logs: {
    where: ["Shay backend logs", "Browser network for SSO_00x codes"],
    critical: [
      { p: "P2", pattern: "SSO_004 session_expired", meaning: "Missing CSRF cookie", action: "Same host; credentials:include", files: ["shay_backend/app/routes/sso.py", "src/aryx/api/security.py"] },
      { p: "P2", pattern: "SSO_002 invalid_redirect", meaning: "redirect_uri not allow-listed", action: "Align IdP + env", files: ["shay_backend/app/routes/sso.py"] },
    ],
  },
  files: [
    F("shay_backend/app/routes/sso.py", {
      brief: "SSO HTTP surface",
      purpose: "Start OAuth and handle IdP callback; issue tokens after email/company resolution.",
      inputs: ["provider=google|microsoft", "redirect_uri", "state", "SSO CSRF cookie"],
      outputs: ["authorization_url", "JWT access/refresh", "stable error slugs SSO_00x"],
      called_by: ["apps/web SSO pages", "login flow"],
      calls: ["sso_service", "user/company stores"],
      logs: ["SSO failures by code", "callback validation rejects"],
      sop: "On login failure, map UI message to SSO slug before reconfiguring IdP.",
    }),
    F("src/aryx/api/security.py", {
      brief: "API-key middleware",
      purpose: "Gate Aryx HTTP with off/optional/required keys; fail closed on exception.",
      inputs: ["Authorization header", "ARYX_API_KEY_MODE"],
      outputs: ["401/403 or pass-through"],
      logs: ["Auth reject paths (no stack leak)"],
      sop: "For MCP, issue tokens via /mcp; never leave mode=off in shared environments.",
    }),
  ],
});

add({
  id: "data_plane", title: "2. Data Plane", kind: "component", tone: "ingest",
  blurb: "Brief → ingest → ER → graph.",
  summary: "Sources become landed records, golden entities in Postgres, then a FalkorDB projection. HITL gates map and adjudication.",
  flowSteps: [
    { n: "1", l: "Brief", d: "Domain + aim" },
    { n: "2", l: "Extract", d: "DB/files/REST/XML" },
    { n: "3", l: "Land", d: "PG + provenance" },
    { n: "4", l: "Tag/Map", d: "Cheap + frontier LLM" },
    { n: "5", l: "Resolve", d: "Block→score→route" },
    { n: "6", l: "Relate", d: "FK / co-occur" },
    { n: "7", l: "Project", d: "FalkorDB ws_N" },
  ],
  tasks: ["Write brief", "Connect DB or upload files", "Approve discovery map", "Resume failed jobs", "Adjudicate review pairs"],
  children: ["brief", "ingest", "er", "graph", "ontology"],
  plugs: ["postgres", "falkordb", "llm_broker", "agents"],
  logs: {
    where: ["stdout logger aryx.pipeline.*", "Jobs API + Observability jobs panel", "discovery_id / job_id correlation (ingest plan)"],
    critical: [
      { p: "P2", pattern: "stage failed / checkpoint", meaning: "Pipeline stage crashed", action: "POST /jobs/{id}/resume from last done stage", files: ["src/aryx/pipeline/stages.py", "src/aryx/api/jobs_api.py", "src/aryx/store/checkpoint_store.py"] },
      { p: "P3", pattern: "adjudication pending", meaning: "Human review backlog", action: "Clear HITL queue", files: ["src/aryx/api/adjudication_api.py", "src/aryx/resolution/run.py"] },
    ],
  },
});

add({
  id: "intelligence", title: "3. Intelligence (Ask + CPQ)", kind: "component", tone: "ask",
  blurb: "Natural language + guided quote.",
  summary: "POST /ask is the single front door. Standard path answers from the graph. Quote path runs the CPQ conversation engine with client-echoed session_data and validated BOM emission.",
  flowSteps: [
    { n: "1", l: "POST /ask", d: "question + history + session" },
    { n: "2", l: "Route", d: "quote | qa | off | ambig" },
    { n: "3a", l: "Graph Ask", d: "gather → synthesise → cite" },
    { n: "3b", l: "CPQ turn", d: "rules → pending → cascade" },
    { n: "4", l: "Response", d: "answer + session_data + usage" },
  ],
  children: ["ask", "cpq"],
  plugs: ["graph", "agents", "logging", "llm_broker"],
});

add({
  id: "agents", title: "4. Agents & Automation", kind: "component", tone: "agent",
  blurb: "Augmented LLM · hub-spoke · pipeline · MCP · Raven.",
  summary: "FULL SOP: open ARYX_AGENTS_SOP.html for exhaustive detail. Runtime has no agents/ package — agent is a role. Use the Pattern → agent map below: every pattern lists which agents run under it, and every agent page lists which patterns it uses. Log tables link to implementing code files (drill or GitHub).",
  flowSteps: [
    { n: "P1", l: "Augmented LLM", d: "tools first → LLM" },
    { n: "P2", l: "Hub-spoke", d: "ask_api / MCP host" },
    { n: "P3", l: "Pipeline chain", d: "serial stages" },
    { n: "P4", l: "Blackboard", d: "Postgres shared state" },

/* ── File nodes ─────────────────────────────────────────────────────────── */
function ensureFileNode(path, meta, parentId) {
  if (!path) return;
  const id = "file:" + path;
  if (N[id]) {
    // merge log hints if richer
    if (meta && meta.fileLogs && !N[id].fileLogs) N[id].fileLogs = meta.fileLogs;
    return;
  }
  const base = path.split("/").filter(Boolean).pop() || path;
  N[id] = {
    id,
    title: base,
    kind: "file",
    path,
    blurb: (meta && (meta.brief || meta.purpose)) || "Source file — open in IDE / GitHub",
    summary: (meta && (meta.purpose || meta.brief)) || `Implementation file at ${path}. Use GitHub or IDE to inspect code.`,
    parentHint: parentId || null,
    purpose: meta && meta.purpose,
    inputs: meta && meta.inputs,
    outputs: meta && meta.outputs,
    called_by: meta && meta.called_by,
    calls: meta && meta.calls,
    fileLogs: meta && (meta.logs || meta.fileLogs),
    sop: meta && meta.sop,
    children: [],
    plugs: [],
    files: [],
  };
}

function ensureFiles() {
  for (const n of Object.values(N)) {
    for (const f of (n.files || [])) {
      ensureFileNode(f.path, f, n.id);
    }
    // Log rows → file drill targets
    for (const c of ((n.logs && n.logs.critical) || [])) {
      for (const p of (c.files || [])) {
        ensureFileNode(p, {
          brief: `Emits / handles log: ${c.pattern}`,
          purpose: `Related to log event "${c.pattern}": ${c.meaning}`,
          fileLogs: [c.pattern],
          sop: c.action,
        }, n.id);
      }
    }
    // Pattern map / agent map file refs
    for (const r of (n.patternMap || [])) {
      for (const p of (r.files || [])) ensureFileNode(p, { brief: `Implements ${r.pattern}` }, n.id);
    }
    for (const r of (n.mapsAgents || [])) {
      for (const p of (r.files || [])) ensureFileNode(p, { brief: `${r.agent} on this pattern` }, n.id);
    }
    for (const r of (n.usesPatterns || [])) {
      for (const p of (r.files || [])) ensureFileNode(p, { brief: `Pattern usage: ${r.pattern}` }, n.id);
    }
  }
}
ensureFiles();

let stack = ["root"];
const $ = (id) => document.getElementById(id);
const panel = () => $("panel");
const cur = () => stack[stack.length - 1] || "root";
const node = (id) => N[id] || {
  id, title: id, kind: "module", blurb: "Undocumented",

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function flowBoard(steps) {
  if (!steps || !steps.length) return "";
  const parts = [];
  steps.forEach((s, i) => {
    if (i) parts.push(`<div class="flow-arrow" aria-hidden="true">→</div>`);
    parts.push(`<div class="flow-step"><div class="n">STEP ${esc(s.n)}</div><div class="l">${esc(s.l)}</div><div class="d">${esc(s.d || "")}</div></div>`);
  });
  return `<h2 class="sec">Process flow</h2><div class="flow-board">${parts.join("")}</div>`;
}

function sopBlock(s) {
  if (!s) return "";
  return `<h2 class="sec">SOP card</h2><div class="sop-grid">
    <div class="sop-box"><h4>Purpose</h4><ul><li>${esc(s.purpose || "—")}</li></ul></div>
    <div class="sop-box"><h4>Actors</h4><ul>${(s.actors||[]).map(a=>`<li>${esc(a)}</li>`).join("") || "<li>—</li>"}</ul></div>
    <div class="sop-box"><h4>Preconditions</h4><ul>${(s.preconditions||[]).map(a=>`<li>${esc(a)}</li>`).join("") || "<li>—</li>"}</ul></div>
    <div class="sop-box"><h4>Postconditions</h4><ul>${(s.postconditions||[]).map(a=>`<li>${esc(a)}</li>`).join("") || "<li>—</li>"}</ul></div>
    <div class="sop-box" style="grid-column:1/-1"><h4>Failure modes</h4><ul>${(s.failure_modes||[]).map(a=>`<li>${esc(a)}</li>`).join("") || "<li>—</li>"}</ul></div>
  </div>`;
}

function tasksBlock(tasks) {
  if (!tasks || !tasks.length) return "";
  return `<h2 class="sec">Tasks performed here</h2><ul class="bul">${tasks.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;
}

function githubUrl(path) {
  if (!path || path.endsWith("/")) return null;
  // docs stay local; skills + src open on GitHub when possible
  if (path.startsWith("docs/")) return null;
  const clean = path.replace(/^\.\//, "");
  // monorepo paths under aryx/ on GitHub for product code
  if (clean.startsWith("src/") || clean.startsWith("apps/") || clean.startsWith("benchmarks/") || clean.startsWith(".claude/") || clean.startsWith("Makefile") || clean.startsWith("CLAUDE")) {
    return "https://github.com/Giggso-Inc/aryx/blob/dev-rv/" + clean;
  }
  // sibling tree (Shay) — best-effort link if mirrored; else null (drill still works)
  if (clean.startsWith("shay_backend/")) {
    return "https://github.com/Giggso-Inc/aryx/blob/dev-rv/" + clean;
  }
  return "https://github.com/Giggso-Inc/aryx/blob/dev-rv/" + clean;
}

/** Path → drill button + optional GitHub open (no source paste). */
function fileLinks(paths) {
  if (!paths || !paths.length) return "<span style='color:var(--muted)'>—</span>";
  return paths.map(p => {
    const gh = githubUrl(p);
    const short = p.replace(/^src\/aryx\//, "…/").replace(/^\.claude\/skills\//, "skills/");
    const drill = `<button type="button" class="link" data-drill="file:${esc(p)}" title="Drill to file SOP: ${esc(p)}">${esc(short)}</button>`;
    const open = gh
      ? ` <a class="gh-open" href="${esc(gh)}" target="_blank" rel="noopener" title="Open ${esc(p)} on GitHub">↗ GitHub</a>`
      : "";
    return `<div class="file-ref">${drill}${open}</div>`;
  }).join("");
}

function agentLinks(ids) {
  if (!ids || !ids.length) return "—";
  return ids.map(id => {
    const n = N[id];
    const label = n ? n.title : id;
    return `<button type="button" class="link agent-chip" data-drill="${esc(id)}" style="font-family:var(--font)">${esc(label)}</button>`;
  }).join(" ");
}

/** Pattern ↔ agent mapping table (SOP clarity). */
function patternMapBlock(n) {
  const rows = n.patternMap;
  if (!rows || !rows.length) return "";
  let html = `<h2 class="sec">Pattern → agent map</h2>
    <div class="callout ok" style="margin-top:0"><strong>How to read:</strong> Pattern = <em>orchestration style</em>. Agent = <em>who runs</em>.
    Click a <strong>pattern</strong> for agents-on-that-pattern. Click an <strong>agent</strong> for patterns-that-agent-uses. Click a <strong>code path</strong> (or ↗ GitHub) to open the implementing file — no source is copied here.</div>
    <table class="t"><thead><tr>
      <th style="width:18%">Pattern</th>
      <th style="width:32%">Agents that use it</th>
      <th style="width:22%">Hub / coordinator</th>
      <th style="width:28%">Key code → drill / GitHub</th>
    </tr></thead><tbody>`;
  for (const r of rows) {
    html += `<tr>
      <td><button type="button" class="link" data-drill="${esc(r.patternId)}" style="font-family:var(--font);font-weight:650">${esc(r.pattern)}</button>
        <div style="color:var(--muted);font-size:.75rem;margin-top:.2rem">${esc(r.when || "")}</div></td>
      <td class="agent-list">${agentLinks(r.agents || [])}</td>
      <td style="font-size:.82rem">${esc(r.hub || "—")}</td>
      <td>${fileLinks(r.files || [])}</td>
    </tr>`;
  }
  html += `</tbody></table>`;

  // Reverse matrix: agent → patterns (computed from patternMap for SOP clarity)
  const reverse = {};
  for (const r of rows) {
    for (const aid of (r.agents || [])) {
      if (!reverse[aid]) reverse[aid] = [];
      reverse[aid].push(r);
    }
  }
  const agentIds = Object.keys(reverse);
  if (agentIds.length) {
    html += `<h2 class="sec">Agent → pattern map (reverse)</h2>
      <p class="body" style="margin-top:0">Same mapping flipped: pick an agent to see which patterns it participates in.</p>
      <table class="t"><thead><tr>
        <th>Agent</th><th>Patterns it uses</th><th>Key code → drill / GitHub</th>
      </tr></thead><tbody>`;
    for (const aid of agentIds) {
      const pats = reverse[aid];
      const n = N[aid];
      const label = n ? n.title : aid;
      const codeSet = [];
      for (const p of pats) for (const f of (p.files || [])) if (!codeSet.includes(f)) codeSet.push(f);
      // Prefer agent-owned files when present
      const agentFiles = (n && n.files || []).map(f => f.path).slice(0, 4);
      const files = agentFiles.length ? agentFiles : codeSet.slice(0, 4);
      html += `<tr>
        <td><button type="button" class="link" data-drill="${esc(aid)}" style="font-family:var(--font);font-weight:650">${esc(label)}</button>
          <div style="color:var(--muted);font-size:.72rem;margin-top:.15rem"><code>${esc(aid)}</code></div></td>
        <td>${pats.map(p =>
          `<button type="button" class="link agent-chip" data-drill="${esc(p.patternId)}" style="font-family:var(--font)">${esc(p.pattern)}</button>`
        ).join(" ")}</td>
        <td>${fileLinks(files)}</td>
      </tr>`;
    }
    html += `</tbody></table>`;
  }
  return html;
}

/** On a pattern node: which agents implement it. */
function mapsAgentsBlock(n) {
  const rows = n.mapsAgents;
  if (!rows || !rows.length) return "";
  let html = `<h2 class="sec">Agents on this pattern</h2>
    <div class="callout" style="margin-top:0"><strong>${esc(n.title)}</strong> is used by the agents below.
    Click an agent to open its page (includes reverse pattern list). Click code to open the file.</div>
    <table class="t"><thead><tr><th>Agent</th><th>Role in this pattern</th><th>Code → drill / GitHub</th></tr></thead><tbody>`;
  for (const r of rows) {
    html += `<tr>
      <td><button type="button" class="link" data-drill="${esc(r.agentId)}" style="font-family:var(--font);font-weight:650">${esc(r.agent)}</button>
        <div style="color:var(--muted);font-size:.72rem"><code>${esc(r.agentId)}</code></div></td>
      <td>${esc(r.role)}</td>
      <td>${fileLinks(r.files || [])}</td>
    </tr>`;
  }
  html += `</tbody></table>`;
  return html;
}

/** On an agent node: which patterns it uses. */
function usesPatternsBlock(n) {
  const rows = n.usesPatterns;
  if (!rows || !rows.length) return "";
  let html = `<h2 class="sec">Patterns this agent uses</h2>
    <div class="callout" style="margin-top:0">This agent (<strong>${esc(n.title)}</strong>) participates in the patterns below.
    Click a pattern to see every agent on that pattern.</div>
    <table class="t"><thead><tr><th>Pattern</th><th>How this agent uses it</th><th>Code → drill / GitHub</th></tr></thead><tbody>`;
  for (const r of rows) {
    html += `<tr>
      <td><button type="button" class="link" data-drill="${esc(r.patternId)}" style="font-family:var(--font);font-weight:650">${esc(r.pattern)}</button>
        <div style="color:var(--muted);font-size:.72rem"><code>${esc(r.patternId)}</code></div></td>
      <td>${esc(r.how)}</td>
      <td>${fileLinks(r.files || [])}</td>
    </tr>`;
  }
  html += `</tbody></table>`;
  return html;
}

function logsBlock(logs) {
  if (!logs) return "";
  let html = `<h2 class="sec">Logging (critical for ops)</h2>`;
  if (logs.where && logs.where.length) {
    html += `<div class="sop-box" style="margin-bottom:.6rem"><h4>Where to look</h4><ul>${logs.where.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`;
  }
  if (logs.fields_stdout) {
    html += `<p class="body"><strong>Stdout fields:</strong> <code>${esc(logs.fields_stdout.join(" · "))}</code></p>`;
  }
  if (logs.fields_raven) {
    html += `<p class="body"><strong>raven_log fields:</strong> <code>${esc(logs.fields_raven.join(" · "))}</code></p>`;
  }
  if (logs.critical && logs.critical.length) {
    html += `<table class="t"><thead><tr><th>Sev</th><th>Pattern / event</th><th>Meaning</th><th>SOP action</th><th>Code → drill / GitHub</th></tr></thead><tbody>`;
    for (const c of logs.critical) {
      const cls = "log-row-" + String(c.p || "p4").toLowerCase();
      const files = c.files || [];
      html += `<tr>
        <td class="${cls}">${esc(c.p)}</td>
        <td><code>${esc(c.pattern)}</code></td>
        <td>${esc(c.meaning)}</td>
        <td>${esc(c.action)}</td>
        <td>${fileLinks(files)}</td>
      </tr>`;
    }
    html += `</tbody></table>
      <p class="body" style="font-size:.82rem;color:var(--muted)">
        <strong>Code column:</strong> path opens the in-explorer file SOP (purpose / I/O / what to watch).
        <strong>↗ GitHub</strong> opens the same path in the repo so you can read the implementation — no source is pasted into this doc.
      </p>`;
  }
  return html;
}

function plugsBlock(n) {
  if (!n.plugs || !n.plugs.length) return "";
  return `<h2 class="sec">How it plugs into Aryx</h2>
    <p class="body" style="margin-top:0">Click a dependency to jump.</p>
    <div class="plugs">${n.plugs.map(p =>
      `<button type="button" class="plug" data-drill="${esc(p)}">↔ ${esc((N[p]&&N[p].title)||p)}</button>`
    ).join("")}</div>`;
}

function childrenBlock(n) {
  if (!n.children || !n.children.length) return "";
  return `<h2 class="sec">Drill down</h2><div class="grid">${n.children.map(cid => {
    const c = node(cid);
    const tone = c.tone ? ` tone-${c.tone}` : (c.kind === "agent" ? " tone-agent" : c.kind === "log" ? " tone-log" : "");
    return `<button type="button" class="card${tone}" data-drill="${esc(cid)}">
      <div class="t">${esc(c.title)}</div>
      <div class="b">${esc(c.blurb || "")}</div>
      <span class="tag">${esc(c.kind)}</span>
    </button>`;
  }).join("")}</div>`;
}

function filesBlock(n) {
  if (!n.files || !n.files.length) return "";
  const rows = n.files.map(f => {
    const fid = "file:" + f.path;
    return `<tr>
      <td><button type="button" class="link" data-drill="${esc(fid)}">${esc(f.path)}</button></td>
      <td>${esc(f.brief || f.purpose || "")}</td>
      <td style="color:var(--muted);font-size:.8rem">${esc((f.logs && f.logs[0]) || f.sop || "—")}</td>
    </tr>`;
  }).join("");
  return `<h2 class="sec">Files & resources</h2>
    <p class="body" style="margin-top:0">Click a path for full SOP brief (purpose, I/O, logs).</p>
    <table class="t"><thead><tr><th>Path</th><th>Brief</th><th>Log / SOP note</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function fileDeep(n) {
  const parent = n.parentHint ? node(n.parentHint) : null;
  const list = (arr, empty="—") => arr && arr.length
    ? `<ul class="bul">${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="body">${empty}</p>`;
  const gh = githubUrl(n.path);
  return `
    <h2 class="sec">File SOP brief</h2>
    <div class="sop-grid">
      <div class="sop-box"><h4>Path</h4><ul><li class="mono">${esc(n.path)}</li></ul>
        ${gh ? `<p style="margin:.5rem 0 0"><a href="${esc(gh)}" target="_blank" rel="noopener">Open on GitHub ↗</a></p>` : ""}
        <p style="margin:.35rem 0 0;font-size:.8rem;color:var(--muted)">IDE: <code>Cmd+P</code> → paste path</p>
      </div>
      <div class="sop-box"><h4>Owned under</h4><ul><li>${parent ? `<button type="button" class="link" data-drill="${esc(parent.id)}" style="font-family:var(--font)">${esc(parent.title)}</button>` : "—"}</li></ul></div>
      <div class="sop-box" style="grid-column:1/-1"><h4>Purpose</h4><ul><li>${esc(n.purpose || n.summary || n.blurb)}</li></ul></div>
      <div class="sop-box"><h4>Inputs</h4>${list(n.inputs)}</div>
      <div class="sop-box"><h4>Outputs</h4>${list(n.outputs)}</div>
      <div class="sop-box"><h4>Called by</h4>${list(n.called_by)}</div>
      <div class="sop-box"><h4>Calls</h4>${list(n.calls)}</div>
      <div class="sop-box" style="grid-column:1/-1"><h4>Log lines / events to watch</h4>${list(n.fileLogs, "No dedicated log list — use parent component logging.")}</div>
    </div>
    ${n.sop ? `<div class="callout warn"><strong>SOP:</strong> ${esc(n.sop)}</div>` : ""}
    <div class="callout">Map only — no source pasted. Use <strong>Open on GitHub</strong> or your IDE path to inspect code.</div>
  `;
}

function render(id) {
  const n = node(id);
  const chips = [
    `<span class="chip k-${esc(n.kind)}">${esc(n.kind)}</span>`,
    `<span class="chip">id: ${esc(n.id)}</span>`,
  ];
  if (n.tone) chips.push(`<span class="chip">${esc(n.tone)}</span>`);
  if (n.kind === "file") chips.push(`<span class="chip k-file">file</span>`);

  return `
    <article class="hero">
      <h1>${esc(n.title)}</h1>
      ${n.path ? `<p class="mono" style="color:var(--muted);margin:0 0 .4rem">📦 ${esc(n.path)}</p>` : ""}
      <p class="lead">${esc(n.summary || n.blurb || "")}</p>
      <div class="meta">${chips.join("")}</div>
    </article>
    ${n.callout ? `<div class="callout">${esc(n.callout)}</div>` : ""}
    ${sopBlock(n.sop)}
    ${flowBoard(n.flowSteps)}
    ${patternMapBlock(n)}
    ${mapsAgentsBlock(n)}
    ${usesPatternsBlock(n)}
    ${tasksBlock(n.tasks)}
    ${logsBlock(n.logs)}
    ${plugsBlock(n)}
    ${childrenBlock(n)}
    ${filesBlock(n)}
    ${n.kind === "file" ? fileDeep(n) : ""}
  `;
}

function bind() {
  panel().querySelectorAll("[data-drill]").forEach(el => {
    el.addEventListener("click", () => drill(el.dataset.drill, true));
  });
}

function crumbs() {
  const el = $("crumbs");
  el.innerHTML = stack.map((id, i) => {
    const n = node(id);
    if (i === stack.length - 1) return `<span class="here">${esc(n.title)}</span>`;
    return `${i ? `<span class="sep">›</span>` : ""}<button type="button" data-jump="${i}">${esc(n.title)}</button>`;
  }).join("");
  el.querySelectorAll("[data-jump]").forEach(b => {
    b.addEventListener("click", () => {
      stack = stack.slice(0, +b.dataset.jump + 1);
      drill(cur(), false);
    });
  });
  $("btnBack").hidden = stack.length <= 1;
}

function railActive(id) {
  document.querySelectorAll("aside.rail a").forEach(a => a.classList.toggle("active", a.dataset.drill === id));
}

function drill(id, push) {
  if (!N[id] && !String(id).startsWith("file:")) {
    console.warn("unknown", id);
    return;
  }
  if (push && cur() !== id) stack.push(id);
  const el = panel();
  el.classList.add("is-swapping");
  setTimeout(() => {
    el.innerHTML = render(id);
    el.classList.remove("is-swapping");
    bind();
  }, 70);
  crumbs();
  railActive(id);
  try { location.hash = id; } catch (_) {}
  $("searchHits").classList.remove("open");
}

function buildRail() {
  const groups = [
    { name: "Start", ids: ["root"] },
    { name: "Identity", ids: ["identity", "sso", "onboarding", "workspace"] },
    { name: "Data plane", ids: ["data_plane", "brief", "ingest", "er", "graph"] },
    { name: "Intelligence", ids: ["intelligence", "ask", "cpq", "cpq_intent", "cpq_guards", "cpq_replacement"] },
    { name: "Agents", ids: ["agents", "pattern_augmented", "pattern_hub_spoke", "pattern_pipeline", "pattern_peer", "agent_internal", "agent_mcp", "agent_intent", "agent_dev_raven", "actions"] },
    { name: "Logs (critical)", ids: ["logging", "log_stdout", "log_raven", "log_cpq", "log_ui", "log_regression"] },
    { name: "Platform", ids: ["web_ui", "aryx_api", "postgres", "llm_broker", "ops"] },
  ];
  $("rail").innerHTML = groups.map(g => `
    <div class="group">${esc(g.name)}</div>
    ${g.ids.map(id => `<a data-drill="${esc(id)}">${esc(node(id).title)}</a>`).join("")}
  `).join("");
  $("rail").querySelectorAll("[data-drill]").forEach(a => {
    a.addEventListener("click", e => {
      e.preventDefault();
      stack = ["root"];
      if (a.dataset.drill !== "root") stack.push(a.dataset.drill);
      drill(a.dataset.drill, false);
    });
  });
}

/* search */
const searchInput = $("search");
const searchHits = $("searchHits");
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { searchHits.classList.remove("open"); return; }
  const hits = Object.values(N).filter(n => {
    const blob = [
      n.id, n.title, n.blurb, n.summary, n.path, n.purpose, n.sop,
      ...(n.tasks || []),
      ...(n.files || []).flatMap(f => [f.path, f.brief, f.purpose, f.sop]),
      ...(n.logs && n.logs.critical || []).map(c => c.pattern + c.meaning),
    ].join(" ").toLowerCase();
    return blob.includes(q);
  }).slice(0, 25);
  searchHits.innerHTML = hits.length
    ? hits.map(n => `<button type="button" data-drill="${esc(n.id)}">${esc(n.title)}<div class="m">${esc(n.kind)} · ${esc(n.blurb || n.path || "")}</div></button>`).join("")
    : `<button type="button"><span class="m">No matches</span></button>`;
  searchHits.classList.add("open");
  searchHits.querySelectorAll("[data-drill]").forEach(b => {
    b.addEventListener("click", () => {
      const n = node(b.dataset.drill);
      stack = ["root"];
      if (n.parentHint) stack.push(n.parentHint);
      if (b.dataset.drill !== "root") stack.push(b.dataset.drill);
      // uniq consecutive
      stack = stack.filter((x, i, a) => i === 0 || x !== a[i - 1]);
      drill(b.dataset.drill, false);
    });
  });
});
document.addEventListener("click", e => {
  if (!searchHits.contains(e.target) && e.target !== searchInput) searchHits.classList.remove("open");
});
$("btnBack").addEventListener("click", () => {
  if (stack.length > 1) { stack.pop(); drill(cur(), false); }
});
window.addEventListener("hashchange", () => {
  const id = location.hash.replace(/^#/, "") || "root";
  if (id !== cur() && N[id]) {
    stack = ["root"];
    if (id !== "root") stack.push(id);
    drill(id, false);
  }
});

buildRail();
const boot = location.hash.replace(/^#/, "") || "root";
if (boot !== "root" && N[boot]) { stack = ["root", boot]; drill(boot, false); }
else drill("root", false);
</script>
</body>
</html>
