# Flag set of the dev environment (ws 1267), for local replays of Ask quotes (docker compose override).
# Use it on top of docker-compose-oci-local.yml:
#   docker compose -f docker-compose-oci-local.yml -f docs/cpq/local_replay_flags.example.yml up -d --no-deps api
# Scope: the six flags below belong to PR #475 / #480 (model scoping) and were verified from `docker inspect aryx-api-1`
# on dev (2026-10-08). Dev also carries flags of other PRs (listed, commented out, below): which of them are on is not
# verified here. List dev's real set and uncomment / add what is missing, so a local result is measured with the same flags:
#   docker inspect aryx-api-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | grep ARYX_CPQ
# The tree fallback is NOT set on dev (its base-model table names the model); set it only for a workspace without that table.
services:
  api:
    environment:
      - ARYX_CPQ_DERIVE_BASE_MODEL_ENABLED=true
      - ARYX_CPQ_MODEL_RESOLUTION_ENABLED=true
      - ARYX_CPQ_RULE_SCOPE_FILTER_ENABLED=true
      - ARYX_CPQ_BASE_MODEL_PLACEHOLDER_GUARD_ENABLED=true
      - ARYX_CPQ_NOT_APPLICABLE_GUARD_ENABLED=true
      - ARYX_CPQ_MODEL_SCOPED_QUESTIONS_ENABLED=true
      # - ARYX_CPQ_MODEL_RESOLUTION_TREE_FALLBACK_ENABLED=true
      # PR #473 (base model narrowing): asks the attributes that separate a model's base models
      # - ARYX_CPQ_BASE_MODEL_NARROWING_ENABLED=true
      # PR #478 (APX 900 narrowing end to end: options, order, derivation, grid quantities, required set)
      # - ARYX_CPQ_DERIVE_DISCRIMINATORS_FIRST_ENABLED=true
      # - ARYX_CPQ_REQUIRED_SET_ASKS_ENABLED=true
      # - ARYX_CPQ_GRID_QUANTITY_PENDING_SELECTORS_ONLY_ENABLED=true
      # APX N70 SVX RSM quantity (2026-10-15): asks a visible free-entry field a rule compares to a number
      # - ARYX_CPQ_RULE_COMPARED_QUANTITY_ASK_ENABLED=true
