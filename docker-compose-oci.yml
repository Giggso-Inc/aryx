# aryx OCI deployment stack — runs on OCI A1.Flex VM (4 OCPU / 24 GB ARM).
#
# What this replaces vs docker-compose.yml (local dev):
#   postgres    → Oracle ADB 26ai       (managed, TLS)
#   falkordb    → Oracle Graph / PGX    (pgx-server container + ADB SQL/PGQ)
#   ollama      → OCI GenAI API         (Cohere Embed v3, Command R / R+)
#   worker      → OCI Functions         (per-doc async, fire-and-forget)
#
# Prerequisites on the VM before first start:
#   1. Copy .env with all ARYX_OCI_* vars filled (see docs/OCI_DEPLOYMENT_PLAN.md)
#   2. docker login container-registry.oracle.com  (for pgx image)
#
# Usage:
#   docker compose -f docker-compose-oci.yml up -d
#
# Memory budget (24 GB total):
#   pgx-server   8 GB  (graph in-memory)
#   api          3 GB
#   shay-api     1 GB
#   mcp          1 GB
#   web          1 GB
#   sales-ui     1 GB
#   OS + Docker  4 GB
#   Buffer       6 GB

services:

  # ── Oracle PGX — in-memory graph analytics + OWL 2 RL reasoning ─────────────
  # Optional: start with --profile pgx when OWL 2 RL reasoning is needed.
  # Core stack (api/mcp/ui/web) boots without PGX.
  pgx-server:
    image: container-registry.oracle.com/database/pgx:latest
    container_name: pgx-server
    profiles: ["pgx"]
    environment:
      - PGX_HEAP_SIZE=8g
    volumes:
      - pgx-data:/pgx/data
    ports:
      # Port 7007 is internal-only — never expose to 0.0.0.0.
      # Security list restricts 7007 to VCN CIDR (10.0.0.0/16) only.
      - "127.0.0.1:7007:7007"
    networks:
      - aryx-net
    restart: unless-stopped
    mem_limit: 9g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7007/version || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── FastAPI — REST API + ingest dispatcher ───────────────────────────────────
  # OCI Security List: port 8000 restricted to VCN CIDR (10.0.0.0/16) — not public internet.
  api:
    build: .
    env_file: .env
    # --workers 2: safe now that /mcp uses StreamableHTTPSessionManager
    # (stateless) instead of SseServerTransport -- the SSE transport's
    # in-process session_id registry would desync across workers under
    # SO_REUSEPORT (see aryx.api.main_mcp._mount_mcp's docstring).
    command: ["uvicorn", "aryx.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment:
      # OCI global toggle — flips all unset backends to oci
      - ARYX_OCI_MODE=true
      - ARYX_OCI_REGION=${ARYX_OCI_REGION:-us-chicago-1}
      - ARYX_OCI_COMPARTMENT_ID=${ARYX_OCI_COMPARTMENT_ID}
      # DB → Oracle ADB 26ai
      - ARYX_DB_BACKEND=oci
      - ARYX_OCI_ADB_DSN=${ARYX_OCI_ADB_DSN}
      - ARYX_RDB_DSN=${ARYX_OCI_ADB_DSN}
      - ARYX_DB_USER=${ARYX_DB_USER}
      - ARYX_DB_PASSWORD=${ARYX_DB_PASSWORD}
      # Graph → Oracle Graph (ADB SQL/PGQ) + PGX for analytics/reasoning
      - ARYX_GRAPH_BACKEND=oci_graph
      - PGX_SERVER_URL=http://pgx-server:7007
      # Worker → OCI Functions (per-doc async ingest)
      - ARYX_WORKER_BACKEND=oci_functions
      - ARYX_OCI_INGEST_FN_ID=${ARYX_OCI_INGEST_FN_ID}
      # Ingestion Phase 2 (docs/ingestion/SPARK_PARALLEL_MIGRATION_ANALYSIS_2026-09-23.md):
      # dynamic-FK LLM judging measured at 38m44s/2186 candidates with the
      # default of 4 workers (29% of a real 2h12m confirm job, the single
      # largest identified cost) -- raised here to measure the real-world
      # impact of more concurrency on this genuinely embarrassingly-parallel
      # stage before considering anything heavier (batching, Spark/AIDP).
      - ARYX_FK_DYNAMIC_JUDGE_WORKERS=16
      # Parse → OCI Document Understanding
      - ARYX_PARSE_BACKEND=oci
      # Object Storage — Document Understanding output + RDF/OWL exports
      - ARYX_OCI_OBJECT_STORAGE_NAMESPACE=${ARYX_OCI_OBJECT_STORAGE_NAMESPACE}
      - ARYX_OCI_DOCUMENT_BUCKET=${ARYX_OCI_DOCUMENT_BUCKET:-aryx-doc-output}
      - ARYX_OCI_RDF_BUCKET=${ARYX_OCI_RDF_BUCKET:-aryx-rdf-exports}
      # Embed → OCI GenAI Cohere Embed v3
      - ARYX_EMBED_BACKEND=oci
      # LLM → OCI GenAI by default. To use Gemini instead, set in .env:
      #   ARYX_LLM_CHEAP_BACKEND=local, ARYX_LLM_FRONTIER_BACKEND=local, ARYX_LLM_PROVIDER=gemini,
      #   ARYX_LLM_BASE_URL, ARYX_LLM_MENIAL_MODEL, ARYX_LLM_REASON_MODEL, ARYX_LLM_API_KEY
      # (see docs/oci-oracle/LLM_GEMINI_ON_OCI_STACK_PLAN_2026-10-05.md).
      - ARYX_LLM_CHEAP_BACKEND=${ARYX_LLM_CHEAP_BACKEND:-oci}
      - ARYX_LLM_FRONTIER_BACKEND=${ARYX_LLM_FRONTIER_BACKEND:-oci}
      - ARYX_LLM_BASE_URL=${ARYX_LLM_BASE_URL:-http://ollama:11434}
      - ARYX_LLM_API_KEY=${ARYX_LLM_API_KEY:-}
      - ARYX_CPQ_INTENT_GEMINI_MODEL=${ARYX_CPQ_INTENT_GEMINI_MODEL:-gemini-2.5-pro}
      # OCI API auth — env-var mode (no ~/.oci/config mount needed)
      - ARYX_OCI_USER_OCID=${ARYX_OCI_USER_OCID}
      - ARYX_OCI_TENANCY_OCID=${ARYX_OCI_TENANCY_OCID}
      - ARYX_OCI_FINGERPRINT=${ARYX_OCI_FINGERPRINT}
      - ARYX_OCI_PRIVATE_KEY_CONTENT=${ARYX_OCI_PRIVATE_KEY_CONTENT}
      # Pipeline timeouts + concurrency
      - ARYX_LLM_TIMEOUT=${ARYX_LLM_TIMEOUT:-900}
      - ARYX_PER_DOC_TIMEOUT=${ARYX_PER_DOC_TIMEOUT:-7200}
      - ARYX_JOB_TIMEOUT_MINUTES=${ARYX_JOB_TIMEOUT_MINUTES:-120}
      # Worker-lost detection (§0): much shorter than the above on purpose —
      # see JobStore.sweep_stale_heartbeat's docstring. Default raised 10 ->
      # 20 (PR review round 5, M1): config_core.py's own default moved to
      # 20 because a sweep false alarm is destructive (the swept worker
      # stops itself and PR #429's cleanup deletes its entities), but this
      # explicit :-10 fallback here meant the OCI deployment never saw that
      # change -- the env var is always set to something in this container,
      # so the code's own default never applies. Only an environment that
      # doesn't pass this var at all (e.g. local, non-compose runs) was
      # ever picking up the new default.
      - ARYX_JOB_HEARTBEAT_TIMEOUT_MINUTES=${ARYX_JOB_HEARTBEAT_TIMEOUT_MINUTES:-20}
      - ARYX_DOC_WORKERS=${ARYX_DOC_WORKERS:-1}
      - ARYX_WORKER_THREADS=${ARYX_WORKER_THREADS:-4}
      - ARYX_BATCH_SIZE=${ARYX_BATCH_SIZE:-500}
      # Landing write batch (BatchSink -> aryx_landed_record executemany).
      # Raised for Oracle ADB here: a 500-row batch was measured at ~2.4s
      # in a 2026-10-04 live confirm (docs/ingestion/
      # CPQ_XML_CONFIRM_RESOLVE_PERFORMANCE_ISSUES_2026-10-04.md §1 Tier 0),
      # implying per-round-trip overhead dominates over row-write cost.
      - ARYX_LANDING_BATCH_SIZE=${ARYX_LANDING_BATCH_SIZE:-3000}
      - ARYX_INGEST_WORKERS=${ARYX_INGEST_WORKERS:-3}
      - ARYX_RELATE_WORKERS=${ARYX_RELATE_WORKERS:-4}
      - ARYX_RELATE_MAX_ATTRS=${ARYX_RELATE_MAX_ATTRS:-15}
      - ARYX_INGEST_RELATE=${ARYX_INGEST_RELATE:-true}
      # Document chunking
      - ARYX_CHUNK_SIZE=${ARYX_CHUNK_SIZE:-1000}
      - ARYX_CHUNK_OVERLAP=${ARYX_CHUNK_OVERLAP:-100}
      - ARYX_CSV_CHUNK_ROWS=${ARYX_CSV_CHUNK_ROWS:-5000}
      - ARYX_XML_MAX_ENTITY_TYPES=${ARYX_XML_MAX_ENTITY_TYPES:-10000}
      - ARYX_XML_MAX_ROWS_PER_TYPE=${ARYX_XML_MAX_ROWS_PER_TYPE:-10000}
      # Scalability caps
      - ARYX_MAX_BLOCK_SIZE=${ARYX_MAX_BLOCK_SIZE:-50000}
      - ARYX_MAX_PAIRS_PER_BLOCK=${ARYX_MAX_PAIRS_PER_BLOCK:-2000}
      - ARYX_MAX_RELATE_PAIRS=${ARYX_MAX_RELATE_PAIRS:-50}
      - ARYX_GRAPH_QUERY_LIMIT=${ARYX_GRAPH_QUERY_LIMIT:-5000}
      - ARYX_TRANSITIVE_MAX_DEPTH=${ARYX_TRANSITIVE_MAX_DEPTH:-4}
      - ARYX_RULES_DB_WARN_THRESHOLD=${ARYX_RULES_DB_WARN_THRESHOLD:-20}
      # Entity resolution thresholds
      - ARYX_ER_AUTO_MERGE=${ARYX_ER_AUTO_MERGE:-0.95}
      - ARYX_ER_ADJUDICATE=${ARYX_ER_ADJUDICATE:-0.95}
      - ARYX_ER_REVIEW=${ARYX_ER_REVIEW:-0.75}
      - ARYX_EMBED_BATCH_SIZE=${ARYX_EMBED_BATCH_SIZE:-50}
      - ARYX_EMBED_DIM=${ARYX_EMBED_DIM:-1024}
      # LLM models
      # cohere.command-r-08-2024 / command-r-plus-08-2024 passed their OCI
      # GenAI deprecation date (2026-05-15) and now fail on-demand inference
      # with "Model ... is retired" (ServiceError 400). cohere.command-a-03-2025
      # is Cohere's current flagship on OCI GenAI (us-chicago-1, confirmed via
      # list_models) and replaces both the R and R+ tiers.
      - ARYX_LLM_PROVIDER=${ARYX_LLM_PROVIDER:-oci}
      - ARYX_LLM_MENIAL_MODEL=${ARYX_LLM_MENIAL_MODEL:-cohere.command-a-03-2025}
      - ARYX_LLM_REASON_MODEL=${ARYX_LLM_REASON_MODEL:-cohere.command-a-03-2025}
      - ARYX_LLM_CHEAP_MODEL_OVERRIDE=${ARYX_LLM_CHEAP_MODEL_OVERRIDE:-cohere.command-a-03-2025}
      - ARYX_LLM_FRONTIER_MODEL_OVERRIDE=${ARYX_LLM_FRONTIER_MODEL_OVERRIDE:-cohere.command-a-03-2025}
      - ARYX_EMBED_MODEL_OVERRIDE=${ARYX_EMBED_MODEL_OVERRIDE:-cohere.embed-multilingual-v3.0}
      # Ontology interchange
      - ARYX_ONTOLOGY_ENABLED=${ARYX_ONTOLOGY_ENABLED:-true}
      - ARYX_ONTOLOGY_FORMATS=${ARYX_ONTOLOGY_FORMATS:-turtle,json-ld,xml,n-triples}
      # Scalability
      - ARYX_DISCOVERY_MAX_PAYLOAD_MB=${ARYX_DISCOVERY_MAX_PAYLOAD_MB:-512}
      # CPQ_LAYOUT_FILE_STORAGE_MIGRATION_PLAN_2026-09-30.md Phase 4/5:
      # ARYX_INGEST_PIPELINE activates the cpq_ingestion master switch
      # (XML raw-graph write for .xml uploads). Layout-file READS always
      # come from aryx_cpq_layout_file now (Phase 5 removed config_layouts/
      # and LocalDirLayoutFileSource entirely -- no read-side toggle left).
      # ARYX_CPQ_LAYOUT_SOURCE is a separate, second opt-in gating the
      # WRITE side: an uploaded .txt/.json is only diverted into
      # aryx_cpq_layout_file (skipping normal ingestion) when BOTH this
      # and ARYX_INGEST_PIPELINE are set -- the master switch alone is
      # deliberately not enough, so a deployment can run XML raw-graph
      # writes without every .txt/.json upload silently changing behavior.
      - ARYX_INGEST_FILE_TYPE=${ARYX_INGEST_FILE_TYPE:-xml,csv}
      - ARYX_INGEST_PIPELINE=${ARYX_INGEST_PIPELINE:-cpq_ingestion}
      - ARYX_CPQ_LAYOUT_SOURCE=${ARYX_CPQ_LAYOUT_SOURCE:-oracle}
      # DB connection pool sizing -- default max_size (25) covers one
      # /graph request's subgraph() fan-out (up to 8 connections,
      # _MAX_RTYPE_WORKERS in oracle_graph_reader_traverse.py) plus
      # concurrent CPQ turn processing and admin-endpoint polling in the
      # same worker; confirmed live (DPY-4005 pool-timeout errors) that
      # the old default of 10 wasn't enough headroom for that combination
      # on an otherwise-healthy container.
      - ARYX_DB_POOL_MAX_SIZE=${ARYX_DB_POOL_MAX_SIZE:-25}
      # CPQ_Hardcode_Audit_dev_oci_2026-09-25.md T6 Phase 3 "scoped"
      # rollout watch: flipped on to confirm the resolver wiring fires
      # correctly in this real environment. Known caveat (T2, same doc):
      # every one of this environment's 24 real workspaces still has no
      # genuine attrToVarMapping coverage, so _cpq_model_candidates keeps
      # returning the ("APXNEXT", "APXNEXT_BOM") fallback for every
      # product here regardless of catalog -- this proves the mechanism
      # runs its real branch, not that per-catalog resolution is
      # correct for a non-APX-NEXT product yet.
      - ARYX_MODEL_POLICY_SCOPED_RESOLUTION_ENABLED=${ARYX_MODEL_POLICY_SCOPED_RESOLUTION_ENABLED:-true}
      # Observability
      - ARYX_LOG_LEVEL=${ARYX_LOG_LEVEL:-INFO}
      # Raven structured logging (aryx.raven_log). LEVEL: DEBUG|INFO|WARN|ERROR.
      # SINK: stdout|s3|both. S3 settings are only read for s3/both; the region
      # has no default and the credentials come from the environment only.
      - ARYX_RAVEN_LOG_ENABLED=${ARYX_RAVEN_LOG_ENABLED:-true}
      - ARYX_RAVEN_LOG_LEVEL=${ARYX_RAVEN_LOG_LEVEL:-INFO}
      - ARYX_RAVEN_LOG_SINK=${ARYX_RAVEN_LOG_SINK:-stdout}
      - ARYX_RAVEN_LOG_HASH_KEY=${ARYX_RAVEN_LOG_HASH_KEY:-}
      - ARYX_RAVEN_LOG_S3_PATH=${ARYX_RAVEN_LOG_S3_PATH:-}
      - ARYX_RAVEN_LOG_S3_ACCESS_ID=${ARYX_RAVEN_LOG_S3_ACCESS_ID:-}
      - ARYX_RAVEN_LOG_S3_ACCESS_TOKEN=${ARYX_RAVEN_LOG_S3_ACCESS_TOKEN:-}
      - ARYX_RAVEN_LOG_S3_REGION=${ARYX_RAVEN_LOG_S3_REGION:-}
      - ARYX_RAVEN_LOG_S3_FLUSH_SECONDS=${ARYX_RAVEN_LOG_S3_FLUSH_SECONDS:-5}
      - ARYX_RAVEN_LOG_S3_BATCH_MAX=${ARYX_RAVEN_LOG_S3_BATCH_MAX:-500}
      - ARYX_RAVEN_LOG_S3_QUEUE_MAX=${ARYX_RAVEN_LOG_S3_QUEUE_MAX:-20000}
      # Shay bridge auth — key must match ARYX_INTERNAL_API_KEY in shay-api
      - ARYX_INTERNAL_API_KEY=${ARYX_INTERNAL_API_KEY}
      # Auth mode: optional lets the trusted web container's proxied browser
      # requests through without an API key. The api port is VCN-restricted
      # (not public internet). require_api_key on /admin/shay/* is a hard
      # guard that ignores this flag — bridge auth stays enforced.
      - ARYX_API_AUTH=${ARYX_API_AUTH:-false}
    ports:
      - "8088:8000"
    networks:
      - aryx-net
    restart: unless-stopped
    # Raised from 3g (docs/ingestion/CPQ_XML_CONFIRM_RESOLVE_PERFORMANCE_ISSUES_2026-10-04.md
    # §3/§0): a single 240MB XML confirm job measured at ~90% (2.7GiB/3GiB)
    # of this limit, and a 2026-10-04 live run saw one of this service's 2
    # uvicorn workers (--workers 2, shared budget) silently die mid-job under
    # that pressure. Mitigation only -- the real fix is §3b (stream the raw
    # graph projection instead of holding it all in memory at once).
    mem_limit: 8g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Shay API — AI sales assistant backend ───────────────────────────────────
  # Shay uses Oracle ADB 26ai (same instance as Aryx) via oracledb thin client.
  # DATABASE_URL is built inline from the Aryx DB credentials — no separate
  # Postgres sidecar required.
  # SHAY_RUN_MIGRATIONS=false: Alembic migrations are Postgres-generated.
  # SHAY_INIT_DB=true: init_db() creates Shay tables via SQLAlchemy create_all
  #   on first boot, using the dialect-aware DialectUUID/DialectJSON types.
  shay-api:
    build:
      context: ./shay_backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=oracle+oracledb://${ARYX_DB_USER}:${ARYX_DB_PASSWORD}@localhost/?dsn=${ARYX_OCI_ADB_DSN}
      - SHAY_RUN_MIGRATIONS=false
      - SHAY_INIT_DB=true
      # Aryx bridge — internal Docker network URL + shared API key
      - ARYX_API_URL_INTERNAL=${ARYX_API_URL_INTERNAL:-http://api:8000}
      - ARYX_INTERNAL_API_KEY=${ARYX_INTERNAL_API_KEY}
      - SHAY_TOKEN_ENCRYPTION_KEY=${SHAY_TOKEN_ENCRYPTION_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - SHAY_BE_PUBLIC_URL=${SHAY_BE_PUBLIC_URL}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI}
      - GOOGLE_GMAIL_REDIRECT_URI=${GOOGLE_GMAIL_REDIRECT_URI}
      - SF_CONNECT_REDIRECT_URI=${SF_CONNECT_REDIRECT_URI}
      - ZOHO_CRM_CONNECT_REDIRECT_URI=${ZOHO_CRM_CONNECT_REDIRECT_URI}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    ports:
      - "8090:8000"
    networks:
      - aryx-net
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # ── MCP server — Model Context Protocol SSE endpoint ────────────────────────
  # OCI Security List: port 8765 restricted to VCN CIDR (10.0.0.0/16) — not public internet.
  mcp:
    build: .
    env_file: .env
    command: ["uvicorn", "aryx.mcp.sse:app", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      - ARYX_API_URL=http://api:8000
      - ARYX_OCI_MODE=true
      - ARYX_OCI_REGION=${ARYX_OCI_REGION:-us-chicago-1}
      - ARYX_OCI_COMPARTMENT_ID=${ARYX_OCI_COMPARTMENT_ID}
      - ARYX_DB_BACKEND=oci
      - ARYX_OCI_ADB_DSN=${ARYX_OCI_ADB_DSN}
      - ARYX_RDB_DSN=${ARYX_OCI_ADB_DSN}
      - ARYX_DB_USER=${ARYX_DB_USER}
      - ARYX_DB_PASSWORD=${ARYX_DB_PASSWORD}
      - ARYX_GRAPH_BACKEND=oci_graph
      - PGX_SERVER_URL=http://pgx-server:7007
      # OCI API auth — env-var mode (no ~/.oci/config mount needed)
      - ARYX_OCI_USER_OCID=${ARYX_OCI_USER_OCID}
      - ARYX_OCI_TENANCY_OCID=${ARYX_OCI_TENANCY_OCID}
      - ARYX_OCI_FINGERPRINT=${ARYX_OCI_FINGERPRINT}
      - ARYX_OCI_PRIVATE_KEY_CONTENT=${ARYX_OCI_PRIVATE_KEY_CONTENT}
    ports:
      - "8765:8765"
    networks:
      - aryx-net
    restart: unless-stopped
    mem_limit: 1g

  # ── Next.js web UI ───────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - ARYX_API_URL_INTERNAL=${ARYX_API_URL_INTERNAL:-http://api:8000}
      - ARYX_INTERNAL_API_KEY=${ARYX_INTERNAL_API_KEY}
      # OCI stack does not run shay-api in-compose; point this at the separately
      # reachable Shay backend if Shay pages/routes are enabled in the web app.
      - SHAY_API_URL_INTERNAL=${SHAY_API_URL_INTERNAL:-http://shay-api:8000}
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      shay-api:
        condition: service_healthy
    networks:
      - aryx-net
    restart: unless-stopped
    mem_limit: 1g

  # ── Streamlit sales-ui — sales-rep quoting chat ──────────────────────────────
  # OCI Security List: port 8502 restricted to VCN CIDR (10.0.0.0/16) — not
  # public internet, same posture as mcp/api. Route external access through
  # the VM's reverse proxy (nginx) like the other UI ports, not by opening
  # 8502 directly — this stack has no OCI Load Balancer/OKE Ingress in front
  # of it (single A1.Flex VM, see header comment); confirm this against the
  # real proxy config before onboarding external users.
  sales-ui:
    build: .
    env_file: .env
    command: ["streamlit", "run", "sales_streamlit/app.py", "--server.port=8502", "--server.address=0.0.0.0", "--server.headless=true"]
    environment:
      - ARYX_RDB_DSN=${ARYX_OCI_ADB_DSN}
      - ARYX_SALES_MCP_URL=http://api:8000/mcp
      - ARYX_SALES_MCP_ALLOW_HTTP=1
      # Same 30s bump as docker-compose.yml's sales-ui block -- live-confirmed
      # 2026-09-01 fix for session.initialize() tearing down under load.
      - ARYX_SALES_MCP_CONNECT_TIMEOUT=30
      # Real MSI host, reached over the VM's normal outbound networking.
      - ARYX_SALES_MSI_BASE_URL=${ARYX_SALES_MSI_BASE_URL}
    ports:
      - "127.0.0.1:8502:8502"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aryx-net
    restart: unless-stopped
    mem_limit: 1g

networks:
  aryx-net:
    driver: bridge

volumes:
  pgx-data:
