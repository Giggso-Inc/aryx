# Aryx localhost stack. Run this file directly:
#   docker compose -f docker-compose.local.yml up --build
#
# Localhost does NOT start Ollama. Point ARYX_LLM_BASE_URL at the shared
# dev-server Ollama URL in .env. ARYX_EMBED_ENDPOINT is optional and defaults
# to the same endpoint inside the API runtime.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aryx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aryx
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aryx"]
      interval: 10s
      timeout: 5s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      # Bundled browser UI (run.sh starts it when BROWSER=1, the image
      # default) listens on 3000 inside the container — never published
      # before, so localhost:3001 had nothing to connect to.
      - "3001:3000"
    volumes:
      # FalkorDB's own entrypoint runs redis-server --dir "$FALKORDB_DATA_PATH",
      # which defaults to /var/lib/falkordb/data — NOT /data. Mounting at /data
      # (the old value here) persisted nothing; every container recreate lost
      # the graph because RDB saves landed in the ephemeral container layer.
      - graphdata:/var/lib/falkordb/data

  worker:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_started

  api:
    build: .
    env_file: .env
    command: ["uvicorn", "aryx.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - ARYX_LLM_BASE_URL=${ARYX_LLM_BASE_URL:?Set ARYX_LLM_BASE_URL to the dev-server Ollama URL.}
      - ARYX_LLM_PROVIDER=${ARYX_LLM_PROVIDER:-ollama}
      - ARYX_LLM_MENIAL_MODEL=${ARYX_LLM_MENIAL_MODEL:-llama3.2:3b}
      - ARYX_LLM_REASON_MODEL=${ARYX_LLM_REASON_MODEL:-llama3.2:3b}
      - ARYX_LLM_TIMEOUT=${ARYX_LLM_TIMEOUT:-360}
      - ARYX_PER_DOC_TIMEOUT=${ARYX_PER_DOC_TIMEOUT:-600}
      - ARYX_DOC_WORKERS=${ARYX_DOC_WORKERS:-1}
      - ARYX_LLM_API_KEY=${ARYX_LLM_API_KEY:-}
      - ARYX_EMBED_MODEL=${ARYX_EMBED_MODEL:-nomic-embed-text}
      - ARYX_ONTOLOGY_ENABLED=${ARYX_ONTOLOGY_ENABLED:-true}
      - ARYX_ONTOLOGY_FORMATS=${ARYX_ONTOLOGY_FORMATS:-turtle,json-ld,xml,n-triples}
    ports:
      - "127.0.0.1:8088:8000"
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  shay-api:
    build:
      context: ./shay_backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=${ARYX_RDB_DSN:-postgresql+asyncpg://aryx:aryx@postgres:5432/aryx}
      - SHAY_RUN_MIGRATIONS=false
      # Canonical frontend root. PLATFORM_URL and APP_URL are derived in config.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # Canonical public Shay backend root. BASE_URL is derived as /api under this root.
      - SHAY_BE_PUBLIC_URL=${SHAY_BE_PUBLIC_URL:-http://localhost:3000/shay}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/shay/api/v1/sso/google/callback}
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI:-http://localhost:3000/shay/api/v1/sso/microsoft/callback}
      - GOOGLE_GMAIL_REDIRECT_URI=${GOOGLE_GMAIL_REDIRECT_URI:-http://localhost:3000/shay/api/v1/gmail/connect/callback}
      - SF_CONNECT_REDIRECT_URI=${SF_CONNECT_REDIRECT_URI:-http://localhost:3000/shay/api/v1/sf/connect/callback}
      - ZOHO_CRM_CONNECT_REDIRECT_URI=${ZOHO_CRM_CONNECT_REDIRECT_URI:-http://localhost:3000/shay/api/v1/zoho/connect/callback}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:8090:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  mcp:
    build: .
    env_file: .env
    command: ["uvicorn", "aryx.mcp.sse:app", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      - ARYX_API_URL=http://api:8000
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      falkordb:
        condition: service_started
    restart: unless-stopped

  ui:
    build: .
    env_file: .env
    command: ["streamlit", "run", "src/aryx/ui/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    environment:
      - ARYX_API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - ARYX_API_URL_INTERNAL=http://api:8000
      - ARYX_INTERNAL_API_KEY=${ARYX_INTERNAL_API_KEY}
      - SHAY_API_URL_INTERNAL=http://shay-api:8000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      shay-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  graphdata:
