[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
markers =
    unit: Unit tests for individual components
    integration: Integration tests for full workflows
    db: Integration tests that require the Docker test database
    validation: File validation tests
    upload: Upload endpoint tests
    s3: S3 integration tests
    local: Local file tests



























